<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><title>editonny · Completed checklist</title></head>
<body>
<!-- Completed checklist. When listing tasks that are no longer necessary: each item appears and is crossed out. -->

<template id="completed-checklist-01-template">
<style>
@font-face{font-family:"Inter";src:url("assets/fonts/Montserrat.ttf") format("truetype");font-weight:100 900;font-display:block}
#root{position:absolute;inset:0;overflow:hidden;font-family:"Inter",sans-serif}
#completedchecklistcompletedchecklist01-a{position:absolute;left:0;top:0;width:0;height:0;opacity:0}
#completedchecklistcompletedchecklist01-c{position:absolute;left:0;top:0;width:640px;border-radius:34px;background:rgba(24,25,32,.95);opacity:0;box-shadow:0 0 0 2px rgba(255,255,255,.16),0 4px 10px rgba(0,0,0,.25),0 24px 54px rgba(0,0,0,.5)}
#completedchecklistcompletedchecklist01-h{position:absolute;left:30px;top:26px;font-family:"Inter";font-size:40px;font-weight:800;letter-spacing:-.01em;line-height:1;color:#fff;white-space:nowrap;opacity:0}
.completedchecklistcompletedchecklist01-i{position:absolute;left:18px;width:604px;height:80px;border-radius:22px;background:rgba(255,255,255,.07);opacity:0}
.completedchecklistcompletedchecklist01-q{position:absolute;left:20px;top:20px;width:40px;height:40px;border-radius:10px;border:5px solid #8e8e93}
.completedchecklistcompletedchecklist01-t{position:absolute;left:80px;top:0;height:80px;display:flex;align-items:center;font-family:"Inter";font-size:54px;font-weight:800;letter-spacing:-.02em;color:#fff;white-space:nowrap}
.completedchecklistcompletedchecklist01-s{position:absolute;left:0;top:0;overflow:visible}
.completedchecklistcompletedchecklist01-r{fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<div id="root" data-composition-id="completed-checklist-01" data-width="1080" data-height="1920" data-duration="4.0">
<div id="completedchecklistcompletedchecklist01-a"><div id="completedchecklistcompletedchecklist01-c"><div id="completedchecklistcompletedchecklist01-h"></div></div></div>
</div>
<script>
(function () {
  const C = (window.__scenes || {})["completed-checklist-01"] || { duration: 4.0 };
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  var D = C.duration || 4.0, t0 = 0;

  var P = {
    x: 540, // Card center on the 1080×1920 canvas, in pixels.
    y: 240, // Card top above the head, in pixels.
    items: "Bí ý tưởng kịch bản|Thức khuya tự dựng clip|Trễ lịch đăng bài hàng ngày", // Two to five vertically arranged items separated by |.
    strikeColor: "rgba(255,69,58,0.55)", // Pencil-strike color.
    title: "XÓA BỎ 3 NỖI LO", // Title above the list; empty hides it.
  };


  var LC = 640, PAD = 18, CA = 80, VG = 10, TX = 80, LETTER_VALUE = 54;
  var list = String(P.items == null ? "" : P.items).split("|").map(function (s) { return s.trim(); }).filter(function (s) { return s; }).slice(0, 5);
  if (list.length < 2) list = ["Trim silence", "Remove pauses"].slice(0, 2 - list.length).concat(list);
  var itemCount = list.length, title = String(P.title == null ? "" : P.title).trim();
  var anchor = document.getElementById("completedchecklistcompletedchecklist01-a"), card = document.getElementById("completedchecklistcompletedchecklist01-c"), header = document.getElementById("completedchecklistcompletedchecklist01-h");
  var itemsTop = PAD + (title ? 70 : 0), contentHeight = itemsTop + itemCount * CA + (itemCount - 1) * VG + PAD;
  anchor.style.left = P.x + "px"; anchor.style.top = P.y + "px";
  card.style.left = (-LC / 2) + "px"; card.style.height = contentHeight + "px";
  if (title) header.textContent = title; else header.style.display = "none";
  var ns = "http://www.w3.org/2000/svg", cells = [], texts = [], strikes = [];
  list.forEach(function (s, i) {
    var cel = document.createElement("div"), cx = document.createElement("div"), tx = document.createElement("div");
    cel.className = "completedchecklistcompletedchecklist01-i"; cx.className = "completedchecklistcompletedchecklist01-q"; tx.className = "completedchecklistcompletedchecklist01-t"; tx.textContent = s;
    cel.style.top = (itemsTop + i * (CA + VG)) + "px";
    var sv = document.createElementNS(ns, "svg"), ri = document.createElementNS(ns, "path");
    sv.setAttribute("class", "completedchecklistcompletedchecklist01-s"); sv.setAttribute("width", "10"); sv.setAttribute("height", "10");
    ri.setAttribute("class", "completedchecklistcompletedchecklist01-r"); ri.setAttribute("pathLength", "1"); ri.setAttribute("stroke-dasharray", "1"); ri.setAttribute("stroke-dashoffset", "1");
    ri.setAttribute("stroke", P.strikeColor || "#ff3b30"); ri.setAttribute("stroke-width", "5");
    sv.appendChild(ri); cel.appendChild(cx); cel.appendChild(tx); cel.appendChild(sv); card.appendChild(cel);
    cells.push(cel); texts.push(tx); strikes.push(ri);
  });

  var adjust = function () {
    var free = (LC - 2 * PAD) - TX - 24, fs = LETTER_VALUE;
    texts.forEach(function (tx) { tx.style.fontSize = LETTER_VALUE + "px"; var w = tx.scrollWidth; if (w > free) fs = Math.min(fs, LETTER_VALUE * free / w); });
    texts.forEach(function (tx, i) {
      tx.style.fontSize = fs + "px"; var w = Math.min(free, tx.scrollWidth), x0 = TX - 10, x1 = TX + w + 10, ym = CA / 2 + 3;
      var tone = (i % 2 ? -1 : 1), a = x0 + (x1 - x0) * .33, b = x0 + (x1 - x0) * .68;
      strikes[i].setAttribute("d", "M" + x0 + " " + (ym + 4 * tone) + " C" + a + " " + (ym - 5 * tone) + " " + a + " " + (ym + 3 * tone) + " " + ((x0 + x1) / 2) + " " + (ym) +
        " S" + b + " " + (ym - 6 * tone) + " " + x1 + " " + (ym - 3 * tone));
    });
    header.style.fontSize = "40px"; var wc = header.scrollWidth, freeContent = LC - 60; if (wc > freeContent) header.style.fontSize = (40 * freeContent / wc) + "px";
  };
  adjust(); if (document.fonts && document.fonts.status !== "loaded") document.fonts.ready.then(adjust);

  var enter = t0 + .05, exit = t0 + D - .3, ent = Math.min(.85, .22 * D), step = Math.max(.04, (ent - .4) / Math.max(1, itemCount - 1));
  tl.fromTo(anchor, { opacity: 0 }, { opacity: 1, duration: .05, ease: "none" }, enter);
  tl.fromTo(card, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .36, ease: "back.out(1.6)" }, enter);
  if (title) tl.fromTo(header, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: .3, ease: "power2.out" }, enter + .08);
  cells.forEach(function (cel, i) { tl.fromTo(cel, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .3, ease: "back.out(1.8)" }, enter + .12 + step * i); });
  var beginTime = enter + .12 + step * (itemCount - 1) + .3 + .05, end = exit - .3, eachValue = (end - beginTime) / itemCount, stroke = Math.max(.12, Math.min(.5, eachValue * .85));
  strikes.forEach(function (ri, i) {
    var q = beginTime + eachValue * i;
    tl.fromTo(ri, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: stroke, ease: "power1.inOut" }, q);
    tl.fromTo(texts[i], { color: "#ffffff" }, { color: "#8e8e93", duration: stroke, ease: "none", immediateRender: false }, q);
    tl.fromTo(cells[i], { x: 0 }, { x: 4, duration: stroke / 2, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, q);
  });

  var live = enter + .45, padding = exit - live, turns = Math.max(1, Math.round(padding / 1.2)), halfValue = padding / (turns * 2);
  if (halfValue > .12) tl.to(anchor, { y: -7, duration: halfValue, ease: "sine.inOut", yoyo: true, repeat: turns * 2 - 1, immediateRender: false }, live);
  tl.to(anchor, { opacity: 0, y: -24, duration: .26, ease: "power2.in", immediateRender: false }, exit);
  tl.to({}, { duration: D }, 0);
  window.__timelines["completed-checklist-01"] = tl;
})();
</script>
</template>
</body></html>
